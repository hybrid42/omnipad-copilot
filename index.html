<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="Omnipad — a minimalist offline dashboard of website tiles." />
  <title>Omnipad</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Omnipad</h1>
      </div>
      <div class="topbar-actions">
        <input id="search" class="search" type="search" placeholder="Filter tiles…" autocomplete="off" spellcheck="false" aria-label="Filter tiles" />
        <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6 6 0 0 1 12.3 3.1c-.1 0-.2-.1-.3-.1Z"/></svg>
        </button>
        <button id="editModeBtn" class="icon-btn" title="Toggle edit mode" aria-label="Toggle edit mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25ZM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.58Z"/></svg>
        </button>
        <button id="menuBtn" class="icon-btn" title="More" aria-label="More options">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
        </button>
      </div>
    </header>

    <main class="board" id="board" aria-label="Dashboard tiles"></main>

    <footer class="statusbar">
      <span id="status" class="status-text">Ready</span>
      <span class="status-hint">Tip: enable Edit mode to drag, add, or remove tiles.</span>
    </footer>
  </div>

  <!-- Overflow menu -->
  <div id="menuSheet" class="menu-sheet" role="menu" hidden>
    <button data-action="add" role="menuitem">＋ Add tile</button>
    <button data-action="export" role="menuitem">⭳ Export tiles</button>
    <button data-action="import" role="menuitem">⭱ Import tiles</button>
    <button data-action="reset" role="menuitem" class="danger">↺ Reset to defaults</button>
  </div>

  <!-- Editor dialog -->
  <dialog id="editor" class="editor">
    <form method="dialog" id="editorForm">
      <h2 id="editorTitle">Add tile</h2>
      <label class="field">
        <span>Name</span>
        <input id="fName" name="name" type="text" maxlength="24" required placeholder="GitHub" autocomplete="off" />
      </label>
      <label class="field">
        <span>URL</span>
        <input id="fUrl" name="url" type="text" required placeholder="github.com" autocomplete="off" inputmode="url" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Accent</span>
          <input id="fColor" name="color" type="color" value="#ff7331" />
        </label>
        <div class="preview-wrap">
          <span>Preview</span>
          <div id="preview" class="tile preview-tile"><span class="tile-badge">G</span><span class="tile-name">GitHub</span></div>
        </div>
      </div>
      <menu class="dialog-actions">
        <button type="button" id="deleteBtn" class="btn danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
        <button type="submit" id="saveBtn" class="btn primary">Save</button>
      </menu>
    </form>
  </dialog>

  <input id="importFile" type="file" accept="application/json" hidden />

  <script src="app.js"></script>
</body>
</html>
